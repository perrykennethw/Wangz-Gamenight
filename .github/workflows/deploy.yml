name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: wangz-505715
  PROJECT_NUMBER: "404444556589"
  REGION: us-central1
  REPOSITORY: wangz-gamenight
  SERVICE: wangz-gamenight
  DEPLOYER_SERVICE_ACCOUNT: github-deployer@wangz-505715.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/404444556589/locations/global/workloadIdentityPools/github-actions/providers/wangz-gamenight

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VITE_AVATAR_BASE_URL: ${{ vars.VITE_AVATAR_BASE_URL || secrets.VITE_AVATAR_BASE_URL }}
      VITE_AVATAR_KEYS: ${{ vars.VITE_AVATAR_KEYS || secrets.VITE_AVATAR_KEYS }}
      VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL || secrets.VITE_PUBLIC_APP_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate avatar build configuration
        shell: bash
        run: |
          if [[ -z "$VITE_AVATAR_BASE_URL" ]]; then
            echo "::error::Set VITE_AVATAR_BASE_URL as a GitHub Actions repository variable or secret."
            exit 1
          fi

          if [[ -z "$VITE_AVATAR_KEYS" ]]; then
            echo "::error::Set VITE_AVATAR_KEYS as a GitHub Actions repository variable or secret."
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Test Family Feud game packs
        run: npm run test:game-packs

      - name: Test avatar object keys
        run: npm run test:avatars

      - name: Test game audio cues
        run: npm run test:audio

      - name: Test shared timer state
        run: npm run test:timers

      - name: Test Spin & Solve game logic
        run: npm run test:spin-solve

      - name: Test Fast Money game logic
        run: npm run test:fast-money

      - name: Test presenter privacy
        run: npm run test:presenter

      - name: Test room invitation links
        run: npm run test:room-invites

      - name: Test returning-player preferences
        run: npm run test:player-preferences

      - name: Test Family Feud turn order
        run: npm run test:turn-order

      - name: Build production application
        run: npm run build

      - name: Test multiplayer privacy
        shell: bash
        run: |
          npm start > "$RUNNER_TEMP/wangz-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          server_ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/health > /dev/null; then
              server_ready=true
              break
            fi
            sleep 1
          done

          if [[ "$server_ready" != "true" ]]; then
            cat "$RUNNER_TEMP/wangz-server.log"
            exit 1
          fi

          npm run test:privacy
          npm run test:moderated-chat
          npm run test:fast-money-integration
          npm run test:turn-order-integration

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push container image
        id: image
        shell: bash
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build \
            --build-arg VITE_AVATAR_BASE_URL="$VITE_AVATAR_BASE_URL" \
            --build-arg VITE_AVATAR_KEYS="$VITE_AVATAR_KEYS" \
            --build-arg VITE_PUBLIC_APP_URL="$VITE_PUBLIC_APP_URL" \
            --tag "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run revision
        run: |
          gcloud run deploy "$SERVICE" \
            --image="${{ steps.image.outputs.uri }}" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --quiet

      - name: Verify production service
        shell: bash
        run: |
          service_url="$(gcloud run services describe "$SERVICE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format='value(status.url)')"
          curl --fail --silent --show-error "$service_url/health"
          ROOM_SERVER_URL="$service_url" npm run test:privacy
