name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: wangz-505715
  PROJECT_NUMBER: "404444556589"
  REGION: us-central1
  REPOSITORY: wangz-gamenight
  SERVICE: wangz-gamenight
  DEPLOYER_SERVICE_ACCOUNT: github-deployer@wangz-505715.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/404444556589/locations/global/workloadIdentityPools/github-actions/providers/wangz-gamenight

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Test multiplayer privacy
        shell: bash
        run: |
          npm start > "$RUNNER_TEMP/wangz-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          server_ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/health > /dev/null; then
              server_ready=true
              break
            fi
            sleep 1
          done

          if [[ "$server_ready" != "true" ]]; then
            cat "$RUNNER_TEMP/wangz-server.log"
            exit 1
          fi

          npm run test:privacy

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push container image
        id: image
        shell: bash
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build --tag "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run revision
        run: |
          gcloud run deploy "$SERVICE" \
            --image="${{ steps.image.outputs.uri }}" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --quiet

      - name: Verify production service
        shell: bash
        run: |
          service_url="$(gcloud run services describe "$SERVICE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format='value(status.url)')"
          curl --fail --silent --show-error "$service_url/health"
          ROOM_SERVER_URL="$service_url" npm run test:privacy
